name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Package
        run: npx --yes @vscode/vsce package --no-dependencies
      # A second copy under a fixed name, so /releases/latest/download/agent-view-latest.vsix
      # resolves without knowing the version — the README's one-line update relies on it.
      - name: Stable asset name
        run: cp agent-view-*.vsix agent-view-latest.vsix
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" *.vsix --title "$GITHUB_REF_NAME" --generate-notes
